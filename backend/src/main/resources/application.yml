spring:
  profiles:
    default: local
  application:
    name: axis-erp
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: Existing local development schema

server:
  port: 8080

axis:
  auth:
    cookie-name: axis_session
    cookie-secure: false
    cookie-same-site: Lax
    session-duration: PT12H
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
